apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  scope: Namespaced
  names:
    plural: certificates
    singular: certificate
    kind: Certificate
    listKind: CertificateList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Certificate is a cert-manager resource.
          properties:
            spec:
              type: object
              description: CertificateSpec defines the desired state.
              properties:
                dnsNames:
                  type: array
                  description: List of DNS names the certificate should be valid for.
                  items:
                    type: string
                issuerRef:
                  type: object
                  description: Reference to the issuer.
                  properties:
                    name:
                      type: string
                      description: Name of the issuer.
                    kind:
                      type: string
                      description: Kind of the issuer.
                duration:
                  type: string
                  description: Certificate duration.
                renewBefore:
                  type: string
                  description: Renewal time before expiration.
            status:
              type: object
              description: CertificateStatus defines the observed state.
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                notAfter:
                  type: string
                  description: Expiration time.
